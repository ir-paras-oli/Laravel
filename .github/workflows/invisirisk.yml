name: Laravel

on:
  schedule:
    - cron: '40 1 * * 1'  # every Monday morning
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read
  actions: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    name: Sync fork and Run build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "ir-pranesh-shrestha"
          git config user.email "pranesh.shrestha@invisirisk.com"
      - name: Add upstream and sync fork
        run: |
          git remote add upstream https://github.com/laravel/framework.git
          git fetch upstream
          git checkout 12.x
          git merge upstream/12.x --no-edit
          git remote set-url origin https://x-access-token:${{ secrets.MY_PAT }}@github.com/ir-pranesh-shrestha/Laravel.git
          git push https://x-access-token:${{ secrets.MY_PAT }}@github.com/ir-pranesh-shrestha/Laravel 12.x

      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}

      - name: Set up PHP 8.3 with Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Laravel dependencies (with retry)
        run: |
          for i in 1 2 3 4 5; do
            composer install --no-interaction --prefer-dist && break || sleep 15
          done

      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@latest
        with:
          cleanup: "true"
          
  gather_analytics:
    runs-on: ubuntu-latest
    name: Gather Analytics
    needs: sync-and-build
    if: always()
    steps:
      - name: Gather Status
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          send_job_status: "true"
          debug: "true"



  
